<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="240" height="150" fill="#0a0f1c"/>
  <g fill="#fff" opacity="0.5">
    <circle cx="18" cy="16" r="0.8"/><circle cx="92" cy="30" r="0.6"/><circle cx="232" cy="34" r="0.8"/>
    <circle cx="228" cy="62" r="0.6"/><circle cx="12" cy="70" r="0.6"/><circle cx="140" cy="8" r="0.6"/>
  </g>

  <text x="12" y="20" fill="#FFD700" font-size="13" font-weight="700">Starlink V3</text>
  <text x="228" y="20" fill="#8a93a6" font-size="8" text-anchor="end">schematic · not to scale</text>

  <!-- solar arrays -->
  <g fill="#1d3f8f" stroke="#5b8cff" stroke-width="0.8">
    <rect x="14" y="44" width="78" height="26" rx="1.5"/>
    <rect x="148" y="44" width="78" height="26" rx="1.5"/>
  </g>
  <g stroke="#5b8cff" stroke-width="0.5" opacity="0.6">
    <path d="M33.5 44v26M53 44v26M72.5 44v26M14 57h78M167.5 44v26M187 44v26M206.5 44v26M148 57h78"/>
  </g>
  <!-- booms -->
  <path d="M92 57h12M136 57h12" stroke="#8a93a6" stroke-width="1.5"/>
  <!-- bus -->
  <rect x="104" y="40" width="32" height="34" rx="3" fill="#2a2f3d" stroke="#FFD700" stroke-width="1.2"/>
  <!-- phased-array panel facing Earth -->
  <rect x="109" y="74" width="22" height="4" fill="#FFD700"/>
  <!-- beams -->
  <path d="M112 78L96 96M120 78v18M128 78l16 18" stroke="#FFD700" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.7"/>

  <g fill="#8a93a6" font-size="8">
    <text x="53" y="38" text-anchor="middle">solar array</text>
    <text x="187" y="38" text-anchor="middle">solar array</text>
    <text x="120" y="35" text-anchor="middle">bus</text>
    <text x="150" y="92">user beams</text>
  </g>

  <path d="M12 106h216" stroke="#ffffff" stroke-opacity="0.12"/>
  <g font-size="9" fill="#d5dae5">
    <text x="12" y="120">~1 Tbps down · 160 Gbps up per satellite</text>
    <text x="12" y="133">First 26 launched 28 Sep 2026 · Starship Flight 14</text>
    <text x="12" y="146" fill="#8a93a6">Deployed near 270 km · 30.5° inclination</text>
  </g>
</svg>
